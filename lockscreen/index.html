<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lock Screen</title>
    <link rel="stylesheet" href="locked.css">
</head>
<body>
    <div class="lock-screen" id="lockScreen">
        <div class="initial-screen" id="initialScreen">
            <div class="time" id="time"></div>
            <div class="date" id="date"></div>
            <div class="swipe-hint">Click anywhere to continue</div>
        </div>
        
        <div class="login-screen" id="loginScreen">
            <div class="login-content">
                <div class="user-avatar">
                    <img src="../gifs/lucy-home.gif" alt="User Avatar">
                </div>
                <div class="user-name">User</div>
                <div class="pin-container">
                    <input type="password" class="pin-input" id="pinInput" placeholder="PIN" maxlength="9" oninput="checkPin()">
                    <div class="error-message" id="errorMessage"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('time').textContent = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', {weekday: 'long', month: 'long', day: 'numeric'});
        }
        
        setInterval(updateTime, 1000);
        updateTime();
        
        document.addEventListener('click', function(e) {
            if (!document.getElementById('lockScreen').classList.contains('login-mode')) {
                document.getElementById('lockScreen').classList.add('login-mode');
            }
        });
        
        function checkPin() {
            const pin = document.getElementById('pinInput').value;
            const errorMsg = document.getElementById('errorMessage');
            
            if (pin.length === 9) {
                if (pin === '531978049') {
                    window.location.href = '../main/home.html';
                } else {
                    errorMsg.textContent = 'Try again';
                    document.getElementById('pinInput').value = '';
                    setTimeout(() => errorMsg.textContent = '', 2000);
                }
            }
        }
    </script>
</body>
</html>
